name: tmp-verify
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for d in 10.1515/hsz-2021-0189 10.1093/nar/gkab482 10.1158/0008-5472.CAN-21-0184 10.1126/science.aan1053 10.1073/pnas.1707514115; do
            echo "=== $d"
            curl -s -A "QZhaoLabWebsite/1.0 (mailto:wtbxsjy@gmail.com)" "https://api.crossref.org/works/$d" | python3 -c '
          import sys,json
          m=json.load(sys.stdin)["message"]
          print("TITLE:",m["title"][0])
          print("JOURNAL:",m.get("container-title"),"VOL",m.get("volume"),"ISSUE",m.get("issue"),"PAGE",m.get("page"))
          print("ISSUED:",m.get("issued"),"ONLINE:",m.get("published-online"),"PRINT:",m.get("published-print"))
          for i,a in enumerate(m.get("author",[]),1): print(i,a.get("given"),a.get("family"),a.get("sequence"),"|".join(x.get("name","") for x in a.get("affiliation",[]))[:80])
          '
          done > /tmp/out.txt
          cp /tmp/out.txt tmp-verify-out.txt
          git config user.name bot; git config user.email bot@x
          git add tmp-verify-out.txt; git commit -qm 'tmp verify output'; git push
