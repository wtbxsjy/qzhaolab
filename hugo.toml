baseURL = "https://wtbxsjy.github.io/qzhaolab/"
# 网站内容（课题组名称、简介、地址、成员、论文、新闻等）都在 data/*.json 中维护。
# 这里只保存网站结构：语言与导航栏。
title = "The QZhao Lab"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]


[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    contentDir = "content/en"
    weight = 1
    title = "The QZhao Lab"
    [[languages.en.menus.main]]
      name = "Research"
      pageRef = "/research"
      weight = 10
    [[languages.en.menus.main]]
      name = "Team"
      pageRef = "/team"
      weight = 20
    [[languages.en.menus.main]]
      name = "Publications"
      pageRef = "/publications"
      weight = 30
    [[languages.en.menus.main]]
      name = "News"
      pageRef = "/news"
      weight = 40
    [[languages.en.menus.main]]
      name = "Join Us"
      pageRef = "/join"
      weight = 50
    [[languages.en.menus.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 60

  [languages.zh]
    languageName = "中文"
    languageCode = "zh-Hans"
    contentDir = "content/zh"
    weight = 2
    title = "赵倩课题组"
    [[languages.zh.menus.main]]
      name = "研究方向"
      pageRef = "/research"
      weight = 10
    [[languages.zh.menus.main]]
      name = "团队成员"
      pageRef = "/team"
      weight = 20
    [[languages.zh.menus.main]]
      name = "论文发表"
      pageRef = "/publications"
      weight = 30
    [[languages.zh.menus.main]]
      name = "新闻动态"
      pageRef = "/news"
      weight = 40
    [[languages.zh.menus.main]]
      name = "加入我们"
      pageRef = "/join"
      weight = 50
    [[languages.zh.menus.main]]
      name = "联系方式"
      pageRef = "/contact"
      weight = 60

[markup.goldmark.renderer]
  unsafe = true
