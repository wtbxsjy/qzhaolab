{{ define "main" }}

  <header class="page-head">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  <div class="prose">{{ .Content }}</div>
  <ul>
    {{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
  </ul>
</article>
{{ end }}
