{{ define "main" }}
<article class="container section">
  <header class="page-head">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  <ul class="news-list">
    {{ range sort site.Data.news "date" "desc" }}
      {{ partial "news-item.html" (dict "item" . "compact" false) }}
    {{ end }}
  </ul>
</article>
{{ end }}
