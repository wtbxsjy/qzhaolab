{{ define "main" }}
{{ $r := site.Data.research }}
<section class="container section page-head">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="prose">{{ partial "l.html" $r.intro | markdownify }}</div>
</section>
<section class="container section-flush">
  {{ range $i, $d := $r.directions }}
    {{ partial "feature.html" (dict "d" $d "i" $i "heading" "h2") }}
  {{ end }}
</section>
{{ end }}
